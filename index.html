<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shieldo - Il tuo scudo digitale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra in alto (Mobile) -->
  <header class="topbar">
    <div class="logo">
      <svg class="shield-svg" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="shieldGrad1" x1="10" y1="10" x2="90" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="checkGrad1" x1="30" y1="40" x2="75" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
        </defs>
        <path d="M50 8L15 24V54C15 78.5 30.2 98.8 50 104C69.8 98.8 85 78.5 85 54V24L50 8Z" fill="#0f172a" stroke="url(#shieldGrad1)" stroke-width="7" stroke-linejoin="round"/>
        <path d="M34 55L45 66L68 41" stroke="url(#checkGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>SHIELDO</span>
    </div>
    <button id="burger">☰</button>
  </header>

  <!-- Menu laterale (Sidebar Desktop) -->
  <div id="side">
    <div class="logo desktop-logo">
      <svg class="shield-svg" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="shieldGrad2" x1="10" y1="10" x2="90" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="checkGrad2" x1="30" y1="40" x2="75" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
        </defs>
        <path d="M50 8L15 24V54C15 78.5 30.2 98.8 50 104C69.8 98.8 85 78.5 85 54V24L50 8Z" fill="#0f172a" stroke="url(#shieldGrad2)" stroke-width="7" stroke-linejoin="round"/>
        <path d="M34 55L45 66L68 41" stroke="url(#checkGrad2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>SHIELDO</span>
    </div>
    <nav id="nav"></nav>
  </div>

  <!-- Contenitore principale dell'app -->
  <main id="app"></main>

  <script src="app.js"></script>
</body>
</html>
